[package]
name = "phpcraft"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
process.workspace = true
anyhow.workspace = true
gpui.workspace = true
editor.workspace = true
project.workspace = true
php-syntax.workspace = true
tree-sitter.workspace = true
php-index.workspace = true
php-analysis.workspace = true
laravel.workspace = true
search.workspace = true
git.workspace = true
history.workspace = true
terminal.workspace = true
agent.workspace = true
async-channel = "2.5.0"
pulldown-cmark = { version = "0.13", default-features = false }
serde_json = "1"
ureq = "3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
sys-locale = "0.3.2"
trash = "5.2.9"

# macOS compiles the Metal shaders when the app starts (no Xcode toolchain needed to build).
# Windows gets them precompiled with fxc.exe: compiling HLSL on every launch made startup slow.
[target."cfg(target_os = \"macos\")".dependencies]
gpui = { workspace = true, features = ["runtime_shaders"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
