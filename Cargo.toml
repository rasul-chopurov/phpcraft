[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.3-alpha"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
php-syntax = { path = "crates/php-syntax" }
project = { path = "crates/project" }
editor = { path = "crates/editor" }
php-index = { path = "crates/php-index" }
php-analysis = { path = "crates/php-analysis" }
laravel = { path = "crates/laravel" }
search = { path = "crates/search" }
git = { path = "crates/git" }
history = { path = "crates/history" }
terminal = { path = "crates/terminal" }
agent = { path = "crates/agent" }
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
ropey = "1.6"
tree-sitter = "0.25"
tree-sitter-php = "0.25.1"
streaming-iterator = "0.1"
anyhow = "1"
rayon = "1.12"
