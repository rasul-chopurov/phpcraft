name: Release

# Builds installers: macOS .dmg, Windows Setup .exe (Inno Setup) and a Linux tarball.
# Run it by hand (artifacts only) or push a v* tag to also publish a GitHub release.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Bundle app and disk image
        run: ./script/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-macos
          path: |
            target/release/PhpCraft-*.dmg
            target/release/PhpCraft-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p phpcraft --locked
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows\phpcraft.iss
          Compress-Archive -Path target\release\phpcraft.exe -DestinationPath "target\release\PhpCraft-$version-windows-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-windows
          path: |
            target/release/PhpCraft-*-Setup.exe
            target/release/PhpCraft-*-windows-portable.zip

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p phpcraft --locked
      - name: Package
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/phpcraft
          cp target/release/phpcraft README.md dist/phpcraft/
          cp assets/icon/phpcraft.svg dist/phpcraft/
          tar -czf "target/release/PhpCraft-$version-linux-x86_64.tar.gz" -C dist phpcraft
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-linux
          path: target/release/PhpCraft-*-linux-x86_64.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
