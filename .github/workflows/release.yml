name: Release

# Builds installers for macOS and Windows (Linux builds are paused):
#   macOS   .dmg + .zip      Apple silicon (arm64) and Intel (x64)
#   Windows Setup .exe + portable .zip   x64 and x86
# Run it by hand (artifacts only) or push a v* tag to also publish a GitHub release
# (tags with a suffix such as v0.0.1-alpha are published as pre-releases).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Bundle app and disk image
        run: TARGET=${{ matrix.target }} ./script/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-macos-${{ matrix.target }}
          path: |
            target/release/PhpCraft-*.dmg
            target/release/PhpCraft-*-macos-*.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Find fxc.exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fxc = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\fxc.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          "GPUI_FXC_PATH=$($fxc.FullName)" >> $env:GITHUB_ENV
      - name: Build
        run: cargo build --release -p phpcraft --locked --target ${{ matrix.target }}
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $num = ($version -split '-')[0]
          $bin = "${{ matrix.target }}\release"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DNumVersion=$num" "/DArch=${{ matrix.arch }}" "/DBinDir=$bin" installer\windows\phpcraft.iss
          Compress-Archive -Path "target\$bin\phpcraft.exe" -DestinationPath "target\release\PhpCraft-$version-windows-${{ matrix.arch }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-windows-${{ matrix.arch }}
          path: |
            target/release/PhpCraft-*-Setup.exe
            target/release/PhpCraft-*-portable.zip

  release:
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes (commits since the previous tag; shown in the app's What's New)
        run: |
          prev=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          {
            echo "## What's new in ${GITHUB_REF_NAME#v}"
            echo
            git log --no-merges --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v '^- Release ' || true
            echo
            echo "Made with ❤️ in Azerbaijan · https://path.az"
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
