name: Release

# Builds installers for every platform:
#   macOS   .dmg + .zip      Apple silicon (arm64) and Intel (x64)
#   Windows Setup .exe + portable .zip   x64 and x86
#   Linux   .tar.gz + .deb   x86_64 and arm64
# Run it by hand (artifacts only) or push a v* tag to also publish a GitHub release
# (tags with a suffix such as v0.0.1-alpha are published as pre-releases).
on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Bundle app and disk image
        run: TARGET=${{ matrix.target }} ./script/bundle-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-macos-${{ matrix.target }}
          path: |
            target/release/PhpCraft-*.dmg
            target/release/PhpCraft-*-macos-*.zip

  windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release -p phpcraft --locked --target ${{ matrix.target }}
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          $num = ($version -split '-')[0]
          $bin = "${{ matrix.target }}\release"
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DNumVersion=$num" "/DArch=${{ matrix.arch }}" "/DBinDir=$bin" installer\windows\phpcraft.iss
          Compress-Archive -Path "target\$bin\phpcraft.exe" -DestinationPath "target\release\PhpCraft-$version-windows-${{ matrix.arch }}-portable.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-windows-${{ matrix.arch }}
          path: |
            target/release/PhpCraft-*-Setup.exe
            target/release/PhpCraft-*-portable.zip

  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            deb: amd64
          - runner: ubuntu-22.04-arm
            arch: arm64
            deb: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig-dev libfreetype-dev libwayland-dev \
            libx11-xcb-dev libxkbcommon-x11-dev libxcb1-dev libvulkan-dev libzstd-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release -p phpcraft --locked
      - name: Package (.tar.gz and .deb)
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          mkdir -p dist/phpcraft
          cp target/release/phpcraft README.md assets/icon/phpcraft.svg dist/phpcraft/
          tar -czf "target/release/PhpCraft-$version-linux-${{ matrix.arch }}.tar.gz" -C dist phpcraft

          root=dist/deb
          mkdir -p $root/DEBIAN $root/usr/bin $root/usr/share/applications $root/usr/share/icons/hicolor/scalable/apps
          cp target/release/phpcraft $root/usr/bin/
          cp assets/icon/phpcraft.svg $root/usr/share/icons/hicolor/scalable/apps/phpcraft.svg
          cat > $root/usr/share/applications/phpcraft.desktop <<DESKTOP
          [Desktop Entry]
          Name=PhpCraft
          Comment=PHP & Laravel IDE in pure Rust
          Exec=phpcraft %F
          Icon=phpcraft
          Terminal=false
          Type=Application
          Categories=Development;IDE;
          MimeType=text/x-php;application/x-php;application/x-httpd-php;text/html;text/css;text/javascript;application/javascript;application/json;application/xml;application/sql;application/x-sql;text/markdown;text/x-yaml;text/plain;inode/directory;
          DESKTOP
          cat > $root/DEBIAN/control <<CONTROL
          Package: phpcraft
          Version: $(echo "$version" | tr - '~')
          Architecture: ${{ matrix.deb }}
          Maintainer: Rasul Chopurov <rasulchopurov@gmail.com>
          Depends: libxkbcommon-x11-0, libvulkan1, libfontconfig1, libfreetype6, libasound2 | libasound2t64
          Section: devel
          Priority: optional
          Homepage: https://path.az/phpcraft
          Description: PHP & Laravel IDE in pure Rust
           Open-source PHP and Laravel IDE. Made with love in Azerbaijan.
          CONTROL
          dpkg-deb --build --root-owner-group $root "target/release/phpcraft_${version}_${{ matrix.deb }}.deb"
      - uses: actions/upload-artifact@v4
        with:
          name: PhpCraft-linux-${{ matrix.arch }}
          path: |
            target/release/PhpCraft-*-linux-*.tar.gz
            target/release/phpcraft_*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/') && !cancelled()
    needs: [macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release notes (commits since the previous tag; shown in the app's What's New)
        run: |
          prev=$(git tag --sort=-v:refname | grep -vx "$GITHUB_REF_NAME" | head -1)
          {
            echo "## What's new in ${GITHUB_REF_NAME#v}"
            echo
            git log --no-merges --pretty='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME" | grep -v '^- Release ' || true
            echo
            echo "Made with ❤️ in Azerbaijan · https://path.az"
          } > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
